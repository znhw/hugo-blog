<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Space+Grotesk:wght@300..700&family=VT323&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
    {{ if .IsHome }}
        {{ site.Title }}
    {{ else }}
        {{ printf "%s | %s" .Title site.Title }}
    {{ end }}
</title>

<link rel="canonical" href="{{ .Permalink }}">

{{ with .Description }}
    <meta name="description" content="{{ . }}">
{{ end }}

{{ template "_internal/opengraph.html" . }}
{{ template "_internal/twitter_cards.html" . }}

{{ partialCached "google_analytics.html" . }}
{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}

{{ with .OutputFormats.Get "rss" }}
    <link
        rel="{{ .Rel }}"
        type="{{ .MediaType.Type }}"
        href="{{ .Permalink }}"
        title="{{ site.Title }}"
    >
{{ end }}
