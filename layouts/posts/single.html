{{ define "main" }}
  <article class="post-content">
     <p id="post-date">
      {{ .Date | time.Format ":date_medium" }} · {{ .ReadingTime }} min read
    </p>
    <h1>{{ .Title }}</h1>

    {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}

    <hr>

    {{ partial "share-btn.html" . }}

    {{ .Content }}

    {{ partial "post-navigation.html" . }}

  </article>


{{ end }}
